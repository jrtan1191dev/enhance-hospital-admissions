    narration: "Mr Tan Ah Meng again — the request we watched arrive without a call. He needs heart monitoring, and he is a falls risk. Every bed in the hospital is scored against four rules the system will never break — among them, never mixing genders in a cubicle, and never placing a patient where the monitoring is not installed — and then three softer preferences it weighs, like keeping a specialty together on one ward. Three beds come back in under fifty milliseconds, each showing why it scored where it did."
    url: /bmu
    setupScript: scenes/role-bmu.mjs
    roiSelector: '.lg\\:col-span-5'
    overlay: none
    steps:
