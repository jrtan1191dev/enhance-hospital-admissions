  # ==========================================================================
  # RESOLUTION 5 of 5 — Beat leads on: the mechanism.
  # ==========================================================================

  - id: 09-provable
    type: slide
    role: resolution
    layout: process-flow
    title: Correctness had to be provable
    cards:
      - icon: database
        title: Pathway A — relational
        text: Metrics computed from state at request time, for reporting.
      - icon: terminal
        title: Pathway B — structured log
        text: The same events with the acting user in every line, for alerting.
      - icon: scale
        title: Parity is asserted
        text: A reconciliation test fails when the two pathways disagree.
      - icon: gauge
        title: Coverage is measured
        text: 214 backend tests over the whole bundle; the frontend counts four paths.
        detail: Price — thresholds exist, nothing runs them
    narration: "Fifth decision. Every operational metric is derivable twice — once from relational state for reporting, once from the structured audit log for alerting — and a test asserts that the two agree. The cost is two things to keep in step. And the honest limit on all of this: the backend has no coverage threshold at all, the frontend declares four, and nothing runs either of them automatically."

  # RUNBOOK DEPENDENCY: a dashboard of zeros satisfies a naive assertion. This must
  # run AFTER the workflows above have executed against the same JVM, and the
  # assertion includes a benchmark evaluation string that only renders with a
  # metric present.
  - id: 09a-analytics-capture
    type: capture
    narration: "Pathway A. Twenty metrics across four epic sections, each with its benchmark and an evaluation against it, computed from relational state at request time. These are numbers the running system produced from the workflows in this film — not figures typed into a slide."
    url: /analytics
    setupScript: scenes/role-bmu.mjs
    roiSelector: main
    overlay: none
    steps:
      - action: wait
        delayMs: 17106
    # 'Target Met' only renders once a metric has been evaluated against its
    # benchmark, so it is a stronger assertion than a bare label. The real
    # guarantee against a zeroed dashboard is scene ORDER: 07b, 08a and 08a2 mutate
    # state earlier in the same capture run, against the same JVM.
    assert:
      visible: ['Hospital Operational KPI', 'Avg ED Turnaround', 'Benchmark:', 'Target Met']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

