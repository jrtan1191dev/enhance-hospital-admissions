  - id: 07a-bed-lifecycle-capture
    type: capture
    narration: "First the board itself. Every bed in the hospital is in exactly one of four states — being cleaned, ready, promised to someone, or occupied — and the colours are simply how a coordinator reads a whole level at a glance. Every decision that follows is a move between those four, which is why a bed can never quietly go missing."
