# How This System Was Designed — Technical Considerations
#
# Authored source. `node .kiro/skills/video-generator/scripts/compile.mjs
# --workDir=video-generation-technical` turns this into storyboard.json, which is
# generated, committed and never hand-edited.
#
# Plan: ../narration-video-plan-technical.md. Sibling: the product film in
# ../video-generation-product/. This one shares the pipeline, theme, narrator and
# seed data — and no beats.
#
# THESIS (re-spined): correctness in this system is a property of how the parts
# interact. It holds under concurrency and under disagreement, and where a piece
# isn't built yet, the boundary is drawn so it fails loudly instead of pretending.
# Every beat states one such property, shows the mechanism, and names the
# prototype-vs-production trade-off behind it.
#
# The five beats:
#   1. Consensus before eligibility  — a patient can't be allocated a bed until
#      every consult resolves.
#   2. Disagreement resolves to safety — specialists disagree, system takes the
#      highest acuity and unions telemetry, no human arbitration.
#   3. Separation of authority — clinicians decide the clinical picture, BMU
#      decides the bed. Different actors on purpose (ADR-0009).
#   4. Concurrency — two people racing for the same case or bed can't both win.
#      Optimistic locking, not pessimistic, because losing the race is cheap.
#   5. Provable, and fails loud where unbuilt — dual-pathway parity test, plus the
#      stubs that refuse to run. Reversibility lives here as one supporting point.
#
# NARRATION RULES: plain, direct, honest. No clever phrasing. Every line reads as
# a clear prototype-vs-production trade-off. Numbers spoken only if the shot
# produces them.
#
# Two schema facts:
#   * `storyline.yml` cannot emit a `vhs_terminal` scene. Terminal evidence is a
#     `capture` of pages/term.html?run=<id> on :4173, fed by
#     tools/record-runs.mjs which runs each command for real and freezes stdout,
#     stderr and exit code into pages/runs/<id>.json (committed). The bytes are
#     real output; only the reveal is presentation, and term.html says so.
#   * An absolute `url` bypasses `baseUrl` (capture.mjs:155), which is how the
#     coverage report and every terminal take are captured from :4173.

deck:
  title: How This System Was Designed — Technical Considerations
  archetype: scr            # situation 1-2, complication 1-2, resolution 2-5, enforced
  engine: html
  theme: light              # matches the app UI, so cuts to dashboards do not flash
  aspect: landscape
  outputs:
    - aspect: landscape
  formats: [png, pdf, html]
  voice:
    provider: auto          # resolves to local Kokoro
    gender: female          # same narrator as the product film
  # Captured against the VITE DEV SERVER, not the jar (the jar 404s on deep links;
  # no SPA fallback). Vite serves deep links and proxies /api to :8080.
  baseUrl: http://127.0.0.1:3000
  fixedTime: '2026-01-15T09:00:00.000Z'

entries:
  # ==========================================================================
  # Deck-only opener. Names the whole decision surface once, so the beats read as
  # a selection from a documented set. Carries no `role:`, so it does not consume
  # SCR budget. No answer-first slide: this is a walkthrough, not a pitch.
  # ==========================================================================

  - id: 00-decision-surface
    type: slide
    in: [deck]
    layout: tiled
    title: Where the design decisions are written down
    body: This walkthrough covers five of them. The rest are on the record.
    cards:
      - icon: map
        title: 11 decision tickets
        text: Each fixes one prototype-versus-production boundary.
        detail: .wayfinder/tickets/
      - icon: file-text
        title: 4 decision records
        text: The domain-critical choices, with the alternatives considered.
        detail: docs/adr/
      - icon: layers
        title: 10 architectural dimensions
        text: Prototype and production, compared side by side.
        detail: docs/architecture.md
      - icon: list-checks
        title: 5 specifications
        text: Written before the code they describe.
        detail: specs/

  # ==========================================================================
  # SITUATION (2 of 2). The engineering problem, not the hospital's problem.
  # ==========================================================================

  - id: 01-problem
    type: slide
    role: situation
    layout: stat-deepdive
    title: What kind of problem this is
    stat:
      value: '6'
      unit: roles
      label: act on one patient, and no single one owns the outcome
    cards:
      - icon: users
        title: A multi-actor process
        text: ED, specialists, bed management, ward nurse, housekeeping, patient.
        detail: Five desks and a patient
      - icon: git-merge
        title: Correctness is a whole-system property
        text: Being right depends on how the parts hand off, not on any one part.
        detail: The design target
    narration: "This is an admissions system, and the thing that makes it hard isn't any one screen. One patient is handled by six roles in turn — the ED, the specialists, bed management, the ward nurse, housekeeping. No single one of them owns whether the outcome is correct. Correctness comes from how they hand off to each other. So that's what I designed for."

  - id: 02-domain-model
    type: slide
    role: situation
    layout: process-flow
    title: The domain, as a data model
    cards:
      - icon: boxes
        title: 5 entities, one tree
        text: A level holds wards, a ward holds beds.
      - icon: workflow
        title: 4 bed states
        text: A bed is in exactly one state at a time.
      - icon: users
        title: 6 acting roles
        text: Each role sees a different view of the same data.
      - icon: plug
        title: 3 external systems
        text: Records, transfers, notifications — none available to me.
        detail: The prototype constraint
    narration: "Here's the model. Five entities in a tree: a level holds wards, a ward holds beds. A bed is always in exactly one of four states. Six roles act on it, each with its own view. And it needs to talk to three outside systems — patient records, sister hospitals, notifications — none of which I have access to. That last line is the constraint that shapes every decision after this."

  - id: 02b-bed-board-capture
    type: capture
    narration: "This is the bed board. It looks like a dashboard, but it's a state machine. Every action is a legal move from one state to the next, and a bed can't leave a state without entering another. That's the first correctness property: a bed can never quietly go missing."
    url: /bmu
    setupScript: scenes/role-bmu.mjs
    roiSelector: 'text=Live Bed Inventory Matrix'
    overlay: none
    steps:
      - action: wait
        delayMs: 18951
    assert:
      visible: ['Live Bed Inventory Matrix', 'Mustard Yellow (Cleaning)', 'White (Clean)']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # ==========================================================================
  # COMPLICATION (2 of 2).
  # ==========================================================================

  - id: 03-both-moves-fail
    type: slide
    role: complication
    layout: comparison
    title: The two easy ways to build this both fail
    cards:
      - icon: eye-off
        title: Fake it and polish it
        text: On camera, a real rule and a styled one look identical.
        detail: Proves nothing
      - icon: ban
        title: Build all of it for real
        text: 3 integrations I can't get. 1 engineer. 0 production credentials.
        detail: Never finishes
    narration: "There are two easy ways to build a prototype like this, and both fail. One: fake everything behind a nice UI. On camera, a real safety rule and a fake one look the same, so it proves nothing. Two: build all of it for real. That doesn't finish — no records endpoint, no identity provider, no solver licence, one engineer, no production access. So the real decision is where to spend the effort I did have."

  - id: 04-cannot-fake
    type: slide
    role: complication
    layout: stat-deepdive
    title: The part you cannot fake
    stat:
      value: '5'
      unit: beds
      label: constrained by the first patient placed in a six-bed cubicle
    cards:
      - icon: triangle-alert
        title: Wrong, not unpolished
        text: Mis-cohort two patients and it's just wrong. A domain reviewer sees it.
        detail: No prototype licence for this
      - icon: shield
        title: Safety can't be a stub
        text: The rules had to be real before anything else was worth showing.
        detail: This is what forces the design
    narration: "And the safety-critical part can't be faked. Put one man in an empty six-bed cubicle, and the other five beds can only take men. Get that wrong and it isn't rough — it's just wrong, and anyone who knows the domain sees it immediately. So the safety rules had to be real. That decides what got built to production standard and what got stubbed."

  # ==========================================================================
  # RESOLUTION 1 of 5 — Consensus before eligibility. (ADR-0007, ADR-0008)
  # ==========================================================================

  - id: 05-consensus
    type: slide
    role: resolution
    layout: process-flow
    title: No bed until every consult is in
    cards:
      - icon: pause
        title: Held, not queued
        text: A consult-gated request sits in ASSESSMENT_PENDING, hidden from bed management.
      - icon: check-check
        title: Consensus gate
        text: It becomes eligible only when every broadcast reaches COMPLETED.
      - icon: git-branch
        title: Chained consults
        text: A specialist can add another cluster; the request waits for all of them.
        detail: Trade-off — slower entry, no premature placement
    narration: "First decision. A patient who needs specialist input is not put in the bed queue right away. The request is held, hidden from bed management, until every consult comes back. Only when all of them are complete does it become eligible for a bed. The trade-off is that entry is slower. But the alternative — allocating a bed before the specialists agree — means placing a patient the assessment might still change. In this domain that's the wrong trade."

  - id: 05a-consult-hold-capture
    type: capture
    narration: "You can see the rule stated in the ED view. When the doctor picks a patient and sends the case to specialist clusters, the admission is held in ASSESSMENT_PENDING. It won't reach bed management until the consults resolve. This is the gate, in the UI, on the way in."
    url: /ed
    setupScript: scenes/role-ed.mjs
    roiSelector: main
    overlay: none
    steps:
      - action: click
        selector: 'table tbody tr >> nth=0'
        target: the first patient in the ED waiting queue
        delayMs: 1200
      - action: waitForText
        value: Smart Assessment Dossier
      - action: click
        selector: 'label:has-text("Request Specialist Consult Pool")'
        target: the Consult-Gated admission checkbox
        delayMs: 900
      - action: waitForText
        value: ASSESSMENT_PENDING
      - action: wait
        delayMs: 14900
    assert:
      visible: ['Emergency Department (ED) Clinical Intake']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # Test-take: the hold is a state, and the honest proof it holds under PARTIAL
  # completion is the consensus-gate test, not a screenshot. Needs a record-runs
  # entry: ./mvnw test -Dtest=ClinicianServiceTest (or a filtered consensus test).
  - id: 05b-consensus-gate-terminal
    type: capture
    narration: "And it holds even when the consults come back one at a time. This test completes some of the broadcasts but not all, and checks the request is still held. Partial agreement is not agreement. The bed queue only sees it once the last consult lands."
    url: http://127.0.0.1:4173/term.html?run=05b-consensus-gate
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 15300
    assert:
      visible: ['ASSESSMENT_PENDING', 'BUILD SUCCESS']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  # ==========================================================================
  # RESOLUTION 2 of 5 — Disagreement resolves to safety, by construction.
  # (ADR-0008: highest acuity wins, telemetry unioned.)
  # ==========================================================================

  - id: 06-discordance
    type: slide
    role: resolution
    layout: comparison
    title: When specialists disagree, the system takes the safe side
    cards:
      - icon: users
        title: The alternative
        text: Ask a human to reconcile the disagreement each time.
        detail: Slow, and it can go the unsafe way
      - icon: shield-check
        title: What it does instead
        text: Takes the highest acuity, and unions every monitoring requirement.
        detail: Trade-off — sometimes over-provisions
    narration: "Second decision. Multiple specialists can review the same patient, and they can disagree — different acuity, different monitoring. The system doesn't ask a coordinator to settle it. It takes the highest acuity anyone assigned, and it turns on every monitoring requirement anyone flagged. The cost is that it sometimes provisions more than a patient strictly needs. In exchange, a disagreement can never resolve toward the less safe option. That's deliberate."

  - id: 06a-discordance-terminal
    type: capture
    narration: "This is that rule as code. When the consults are reconciled, the effective acuity is set to the highest one across all respondents, and the queue sorts on that effective tier — not on the ED's original number. The test pins it: give it a higher specialist tier, and the effective tier moves up."
    url: http://127.0.0.1:4173/term.html?run=06a-discordance
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 18600
    assert:
      visible: ['effectiveAcuityTier', 'BUILD SUCCESS']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  # ==========================================================================
  # RESOLUTION 3 of 5 — Separation of decision authority. (ADR-0009) NET-NEW.
  # ==========================================================================

  - id: 07-separation
    type: slide
    role: resolution
    layout: tiled
    title: Who decides the clinical picture and who decides the bed are different people
    cards:
      - icon: stethoscope
        title: Clinicians decide clinical
        text: Acuity, telemetry, diversion. Not the ward, not the bed.
      - icon: bed
        title: BMU decides the bed
        text: After consensus, the coordinator sets the admitting cluster and allocates.
      - icon: git-merge
        title: Why split it
        text: Forcing doctors to pick a ward during triage creates friction and delays care.
        detail: Trade-off — one more handoff
    narration: "Third decision, and it's about who decides what. Clinicians decide the clinical picture — acuity, monitoring, whether to divert. They don't touch the ward or the bed. That's bed management's call, after consensus. I split it because making doctors negotiate a ward in the middle of emergency triage creates friction between departments and pulls them off patient care. The cost is one more handoff. The benefit is that each call is made by the person who should own it, with the information they actually have."

  - id: 07a-admitting-authority-capture
    type: capture
    narration: "You can see the split on the queue. The blue badge is the admitting cluster the coordinator set — that's the authoritative one. The plain badge is the ED's suspected service. The allocation engine scores against the coordinator's choice, not the ED's guess. Two different decisions, two different owners, and the system knows which one is authoritative."
    url: /bmu
    setupScript: scenes/role-bmu.mjs
    roiSelector: main
    overlay: none
    steps:
      - action: wait
        delayMs: 21200
    assert:
      visible: ['(Admitting)']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # ==========================================================================
  # RESOLUTION 4 of 5 — Concurrency: two races, one mechanism. Optimistic, not
  # pessimistic, because losing the race is cheap and self-correcting.
  # ==========================================================================

  - id: 08-concurrency
    type: slide
    role: resolution
    layout: comparison
    title: Two people can race for the same thing; only one wins
    cards:
      - icon: lock
        title: The alternative
        text: Pessimistic locking — hold a database lock so a second writer waits.
        detail: Deadlock risk, connection-pool pressure
      - icon: git-compare
        title: What it does instead
        text: Version columns on 3 entities. The losing write gets a 409.
        detail: Trade-off — the loser retries, which is free
    narration: "Fourth decision, about concurrency. Two specialists can try to claim the same case, and two coordinators can try to allocate the same bed. Only one can win. I used optimistic locking — a version column — not pessimistic locking. The reason is the cost of losing the race. Here, the loser just gets a conflict, sees the case is already taken, and picks the next one. Nothing is lost. Pessimistic locking would hold a database lock to prevent a conflict that costs nothing and fixes itself, and it adds deadlock risk and pool pressure. So optimistic is the correct trade, not just the cheaper one."

  - id: 08a-vacate-capture
    type: capture
    narration: "First, the state machine itself. A nurse discharges a patient, and the bed doesn't go straight to available — it goes to pending cleaning, with a thirty-minute clock. There's no jump from occupied to clean, because in a real hospital there isn't one."
    url: /ward
    setupScript: scenes/role-ward.mjs
    roiSelector: main
    overlay: none
    steps:
      - action: click
        selector: 'button:has-text("Patient Vacated Bed") >> nth=0'
        target: Patient Vacated Bed on the first occupied bed
        delayMs: 900
      - action: waitForText
        value: MUSTARD YELLOW
      - action: wait
        delayMs: 15117
    assert:
      visible: ['Inpatient Ward Reception & Bed Control', 'Ward Nursing Station Bed Control']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  - id: 08a2-sanitise-capture
    type: capture
    narration: "Housekeeping signs off the cleaning, and only then does the bed return to the pool as clean. Four states, three gates, one owner for each move. Every transition goes through one service method, so there's a single place the write happens — which is what makes the version check enough."
    url: /ward
    setupScript: scenes/role-housekeeping.mjs
    roiSelector: main
    overlay: none
    steps:
      - action: click
        selector: 'button:has-text("Sign-Off Clean") >> nth=0'
        target: Sign-Off Clean on the first bed pending cleaning
        delayMs: 900
      - action: wait
        delayMs: 16600
    assert:
      visible: ['Housekeeping (EVS) Rapid Bed Turnover', '30-Minute Turnover Queue']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  - id: 08b-conflict-409-terminal
    type: capture
    narration: "The race itself I can't show honestly in a browser — a real race needs two clients at once, and faking it in one tab would be a lie. So it's a test. Two specialists claim the same broadcast: the first write wins, the second comes back as a 409 Conflict with a problem-detail body the client can act on. That's the loser retrying, which costs nothing."
    url: http://127.0.0.1:4173/term.html?run=08b-conflict-409
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 22200
    assert:
      visible: ['409', 'BUILD SUCCESS']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  # ==========================================================================
  # RESOLUTION 5 of 5 — Provable, and fails loud where unbuilt. Reversibility
  # (the seam / profile boundary) lives here as one supporting point.
  # ==========================================================================

  - id: 09-provable
    type: slide
    role: resolution
    layout: process-flow
    title: Provable where built, loud where not
    cards:
      - icon: database
        title: Two pathways, checked
        text: Every metric from the database and from the audit log; a test asserts they match.
      - icon: git-branch
        title: One profile boundary
        text: A Spring profile picks mocks or production adapters at startup. No demo flags.
      - icon: ban
        title: Stubs that refuse to run
        text: The 3 unbuilt adapters throw on invocation instead of returning fake data.
        detail: Trade-off — only the prototype path is tested
    narration: "Fifth decision, about proof. Every operational metric can be computed two ways — from the database and from the audit log — and a test fails if the two disagree. And for the parts I didn't build: they sit behind interfaces chosen by a Spring profile, and the production versions throw the moment they're called instead of returning fake data. The honest cost is that only the prototype side of each boundary is actually tested. But an unbuilt piece that fails loudly is safer than one that quietly pretends."

  - id: 09a-analytics-capture
    type: capture
    narration: "This is the database pathway. Twenty metrics across four sections, each with a benchmark and how it scored. These are numbers the running system produced from the workflows in this walkthrough — not figures on a slide."
    url: /analytics
    setupScript: scenes/role-bmu.mjs
    roiSelector: main
    overlay: none
    steps:
      - action: wait
        delayMs: 17106
    assert:
      visible: ['Hospital Operational KPI', 'Avg ED Turnaround', 'Benchmark:', 'Target Met']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  - id: 09b-parity-terminal
    type: capture
    narration: "And the two pathways are checked against each other, not eyeballed. The reconciliation test computes each metric both ways and fails if they disagree. That's the only thing that makes a second pathway worth maintaining."
    url: http://127.0.0.1:4173/term.html?run=09b-parity
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 12770
    assert:
      visible: ['Tests run: 1', 'Failures: 0', 'BUILD SUCCESS']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  - id: 09c-stub-contract-terminal
    type: capture
    narration: "And the stubs are tested to fail. The three production adapters — the solver, the records gateway, the transfer gateway — each throw the moment they're invoked. A placeholder nobody tests eventually gets called by accident, in a profile nobody checked. These can't."
    url: http://127.0.0.1:4173/term.html?run=09c-stub-contract
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 16950
    assert:
      visible: ['UnsupportedOperationException', 'BUILD SUCCESS']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  - id: 09d-coverage-capture
    type: capture
    narration: "Measured across the whole backend: ninety-four percent of instructions, ninety-seven percent of lines, sixty-nine percent of branches. The branch number is the one worth saying out loud, because that's where the untested paths are. It shows the domain layer is well exercised. It is not a quality gate."
    url: http://127.0.0.1:4173/jacoco/index.html
    roiSelector: 'body'
    overlay: none
    captureMode: stills
    assert:
      visible: ['Missed Instructions', 'com.hospital.admissions', 'Total']
      notVisible: ['Cannot GET', 'Not Found']

  - id: 09e-gate-red-terminal
    type: capture
    narration: "And here's the most honest thing I can show you. The frontend declares four coverage thresholds at ninety percent. Run them and one comes back red — branches at seventy-five. Nothing caught it, because nothing runs it automatically. A threshold no pipeline runs isn't a safeguard; it's a number in a config file. That's on the list of what's owed."
    url: http://127.0.0.1:4173/term.html?run=09e-gate-red
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 21300
    assert:
      visible: ['branches: 90', 'does not meet global threshold', '74.84%']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  # ==========================================================================
  # Close — the debt ledger and the countable artifacts. No CTA (removed from
  # film and deck at the user's request).
  # ==========================================================================

  - id: 10-ledger
    type: slide
    layout: tiled
    title: What's stubbed, and the boundary it's stubbed behind
    body: Each of these is a deliberate prototype choice with a clear path to production.
    cards:
      - icon: database
        title: State and transport
        text: In-memory data a restart erases; polling that won't scale.
        detail: Postgres driver present; STOMP push designed in ticket 003
      - icon: user-check
        title: Identity
        text: Header-driven personas are convenience, not authentication.
        detail: The default config already denies everything
      - icon: cpu
        title: Optimality and integration
        text: A heuristic that can be beaten; two gateways with nothing real behind them.
        detail: 3 interfaces, 3 fail-fast adapters
      - icon: test-tube
        title: Enforcement
        text: Four declared thresholds, no pipeline to run them, one currently red.
        detail: The suite exists; the CI wiring doesn't
    narration: "So here's what's stubbed, and it's stubbed on purpose. In-memory data a restart wipes. Polling instead of push. A heuristic instead of a real solver. Header personas instead of real authentication. And no CI to run the coverage gates. Every one of these sits behind an interface or a profile that's already in place, so the production version is added, not retrofitted. On method: AI wrote a lot of this code. Which trade-off to make, which approach was right, and the final shape of the code — those decisions were mine."

  - id: 10a-artifacts-terminal
    type: capture
    narration: "One last count, because the order is the part people doubt. Eleven decision tickets, twenty-eight implementation issues, five specs, four decision records — all written before the code they describe."
    url: http://127.0.0.1:4173/term.html?run=10a-artifacts
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 13046
    assert:
      visible: ['wayfinder tickets : 11', 'scratch issues    : 28', 'decision records  : 4']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']
