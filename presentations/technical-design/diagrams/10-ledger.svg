<svg viewBox="0 0 1176 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="10-ledger-title 10-ledger-desc">
<title id="10-ledger-title">Stubs sit behind one boundary</title>
<desc id="10-ledger-desc">Layer stack showing production-grade domain logic above a gateway interface and profile boundary, with prototype stubs below it.</desc>
<defs>
<marker id="10-ledger-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#64748B"/></marker>
<marker id="10-ledger-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#10B981"/></marker>
</defs>
<rect width="1176" height="736" fill="#F1F5F9"/>
<rect x="24" y="64" width="840" height="168" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<text x="48" y="156" fill="#64748B" font-size="19" font-weight="500" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.12em">01</text>
<text x="112" y="124" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif">Domain logic</text>
<text x="112" y="164" fill="#64748B" font-size="24" font-family="ui-monospace, Menlo, Consolas, monospace">constraint engine · state machines</text>
<text x="112" y="196" fill="#64748B" font-size="24" font-family="ui-monospace, Menlo, Consolas, monospace">consensus gate</text>
<rect x="24" y="400" width="840" height="168" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<text x="48" y="492" fill="#64748B" font-size="19" font-weight="500" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.12em">03</text>
<text x="112" y="460" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif">Prototype stubs</text>
<text x="112" y="500" fill="#64748B" font-size="24" font-family="ui-monospace, Menlo, Consolas, monospace">H2 · polling · header personas</text>
<text x="112" y="532" fill="#64748B" font-size="24" font-family="ui-monospace, Menlo, Consolas, monospace">mock EHR · heuristic solver</text>
<rect x="24" y="232" width="840" height="168" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="2.5"/>
<text x="48" y="324" fill="#64748B" font-size="19" font-weight="500" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.12em">02</text>
<text x="112" y="292" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif">Gateway interfaces and profile boundary</text>
<text x="112" y="332" fill="#64748B" font-size="24" font-family="ui-monospace, Menlo, Consolas, monospace">@Profile(prototype)</text>
<path d="M864 316 H888" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="896" y="300" fill="#0F172A" font-size="24" font-style="italic" font-family="Inter, system-ui, sans-serif">production is</text>
<text x="896" y="332" fill="#0F172A" font-size="24" font-style="italic" font-family="Inter, system-ui, sans-serif">added here, not</text>
<text x="896" y="364" fill="#0F172A" font-size="24" font-style="italic" font-family="Inter, system-ui, sans-serif">retrofitted</text>
<text x="24" y="636" fill="#64748B" font-size="19" font-weight="500" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.12em">PRODUCTION-GRADE ABOVE · STUBBED BELOW</text>
</svg>
