  # ---- Beat 4: transparency + discharge runway (PP5 + PP6)
  # The contrast bridge restores the old deck's 06-before-discharge point (the
  # afternoon gridlock) without spending a slide on it.
  - id: 09-experience
    type: slide
    role: resolution
    layout: lifecycle
    title: The same journey without the anxiety — and an exit that starts early
    cards:
      - icon: smartphone
        title: A milestone, on a phone
        text: Three stages and a queue position within the patient's ward class, with an honest, kind delay note.
      - icon: pill
        title: Meds to the bedside
        text: A morning sign-off auto-queues discharge medicines for delivery before eleven.
      - icon: refresh-cw
        title: A closed loop
        text: Terminal cleaning turns the bed white and notifies bed management automatically.
    narration: "The fourth fix sits at both ends of the stay. At the front, the family stops asking the triage nurse: they see their position among the patients in their own ward class, and an honest reason when it slips. At the back, discharge starts two or three days early, the medicines are packed overnight instead of chased at noon, and the cleaning clock starts the moment a bed empties."

