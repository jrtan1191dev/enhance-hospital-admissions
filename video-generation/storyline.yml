# Hospital Admissions — SCR pitch deck and video spine.
#
# storyline.yml is the authored source. `node scripts/compile.mjs` turns it into
# storyboard.json (generated, committed, never hand-edited). `node scripts/deck.mjs`
# renders the slides to PNG/PDF/HTML with no TTS, no running app and no cost.
#
# THE FILENAME IS LOAD-BEARING — do not rename it back to deck.yaml. compile.mjs:38
# and deck.mjs:305 default to `<workDir>/storyline.yml`, and generate.mjs:83 HARDCODES
# it with no override flag. Under any other name generate.mjs silently skips
# compilation (it gates on existsSync, so there is no error) and deck.mjs renders with
# storylineSource = null, which drops every `in: [deck]` entry — the two answer-first
# slides — from the deck without warning.
#
# Structure follows narration-video-plan.md §7 (nested SCR), reconciled to the
# SCR archetype's hard cap of five resolution beats:
#   - macro Situation (2 beats) + macro Complication (2 beats), established once.
#     Both roles are now AT the archetype ceiling (deck.mjs SCR_SKELETON:
#     situation 1-2, complication 1-2, resolution 2-5) — nothing further can be
#     added to either without splitting the storyline.
#   - five resolution beats, each a mechanism-only setup slide immediately
#     followed by a run of live captures that demonstrate it (the archetype
#     convention: the slide makes the claim, the captures are the evidence)
#   - the six documented pain points are grouped into four mechanism beats plus
#     a measurable-outcome beat:
#       1. synthesis + safe digital dispatch      (PP1 + PP2)
#       2. deterministic diversion                (PP3)
#       3. ghost capacity, pack-then-batch        (PP4)
#       4. transparency + discharge runway        (PP5 + PP6)
#       5. the control tower — every decision measured
#
# Each beat's single capture is split into several granular capture-only
# scenes — one per distinct mechanism or persona named in the mechanism
# slide's cards. Captures carry no `role`, so this granular split does NOT
# count toward the archetype's 5-beat cap; only `slide` entries with
# `role: resolution` do.
#
# ---------------------------------------------------------------------------
# NARRATION CLARITY RULES (Decisions #21-#33, agreed in review)
# ---------------------------------------------------------------------------
# The prior narration was diagnosed as having four classes of comprehension gap:
# unbound nouns ("which findings?"), undefined jargon, unstated criteria
# ("three matching patients" — matching on what?), and features stated without
# their payoff. Every narration line below is written against these rules:
#
# #21 BIND BOTH HALVES. A noun the narration leans on must be bound to the
#     scene's own input AND output — never to a downstream payload. The ED
#     synthesis emits tier/specialty/ward-class/monitoring, NOT a bed; the bed
#     is the solver's output two beats later (verified: ed.tsx form fields).
#
# #22 PLAIN LANGUAGE IN THE VOICE, TECHNICAL LABELS ON THE CARDS.
#     Dropped from the voice entirely: "cohort lock", "discordance",
#     "bilateral", "subacute", "step-down", "concordance", "ghost capacity".
#
# #23 ARBITRARY INTERNAL LABELS ARE PARAPHRASED; PROFESSIONAL VOCABULARY IS KEPT.
#     The bed-state colours are internal codes, so the voice says "being
#     cleaned, ready, promised, occupied" and lets the on-screen legend supply
#     the colours (bmu.tsx:1285-1297 already prints both). "Acuity tier",
#     "telemetry" and "troponin" are real clinical vocabulary and are kept —
#     glossed once on first use.
#
# #24 AUDIENCE IS A+B+D: technical reviewer, health executive, and the public.
#     Hence the NO-ORPHAN RULE: plain meaning first, precise term second in
#     apposition. A precise term is never the sole carrier of an idea.
#
# #25 DECISION #17 REINTERPRETED. It bars OUTCOME MAGNITUDE before the control
#     tower, not numerals. Descriptive cardinalities ("four rules", "five
#     beds", "thirty-minute clock") are encouraged wherever they remove
#     ambiguity — withholding them was the direct cause of the vagueness.
#     Only `stat` blocks and performance claims are still reserved for beat 5.
#
# #26 PER-SCENE SHAPE: contrast bridge -> mechanism with bound nouns -> payoff.
#     The bridge names the old way in one clause (this replaces the old deck's
#     separate before/after slides, which cannot return as beats given the
#     5-resolution cap). Vary which part is explicit so it never sounds like a
#     template.
#
# #27 DEIXIS AT EVERY SCREEN OR PERSONA CHANGE ("Up on the ward", "Back in bed
#     management"). 22 hard cuts each cost the viewer a "where am I?" — two
#     words resolve it before the content arrives.
#
# #28 AUTHORIAL "we" FOR DESIGN RATIONALE ONLY, rationed to ~5 uses total.
#     Impersonal for mechanism description. Never second person.
#
# #29 PROTAGONIST: Mr Tan Ah Meng carries dispatch -> comparative notes ->
#     solver match -> tracker (04c, 04c2, 08a, 10a). Every return is
#     signposted, which doubles as the connective tissue between beats.
#
# #30 NAME COLLISION: Mr Tan Ah Meng and Mrs Tan Boon Hwa are distinct
#     patients and P106 is the ONLY hospital-at-home diversion in the seed
#     (DataInitializer.java:1245), so reselection is impossible. Both are
#     therefore always spoken in full with honorifics, never as bare "Tan".
#
# #31 CLINICAL SPECIFICS RESTORED IN FULL from the seed, so the voice describes
#     what is actually on screen: Chua Wee Kiat BP 98/62, troponin 180 ng/L
#     (DataInitializer.java:922-935); Nurul Huda BP 124/78, troponin Normal
#     (:946-959); Fernandez's consult note names the abdominal pain that
#     justifies the chained surgical review (:800) — previously omitted from
#     the voice despite being printed on screen.
#
# #32 THE PRICED COMPLICATION (02b) USES NO INVENTED FIGURE. product-idea/
#     contains no citable status-quo cost, so the stat is derived from facts
#     already in the system: a Class B2 cubicle is 5-6 beds (ed.tsx ward-class
#     options) and gender cohorting is an absolute invariant, therefore five of
#     six beds can only go to patients matching the first. True by construction,
#     and a cost of TODAY rather than a claim about the prototype.
#
# #33 CAPTURE DELAYS ARE DERIVED, NOT GUESSED. Each capture's trailing
#     `wait delayMs` below is set to (estimated narration ms + 400ms tail) minus
#     the sum of its preceding step delays, keeping `ratePct` inside the +/-7%
#     inaudible band (core.mjs RATE_FIT.INAUDIBLE). Estimates assume ~150 wpm.
#     RE-DERIVE THESE from measured audio after the first `synthesize.mjs` run;
#     that is the only way to avoid a second (expensive) capture pass.
#
# Voice register: warm/human on the Situation and CTA bookends; crisp and
# analytical on the resolution beats (Decision #16). SCR is unlabelled — the
# structure is carried by layout and cadence, not by "Issue:/Resolution:" tags.
#
# Capture entries carry NO `role`: they are evidence, not SCR beats, so they
# must not count toward the beat totals.

deck:
  title: Recovering Hospital Beds Without Building More
  archetype: scr            # situation -> complication -> resolution beat checks
  engine: html              # bento templates — the polished, non-wordy look
  theme: light              # matches the light app UI, so cuts to the dashboards do not flash
  aspect: landscape
  outputs:
    - aspect: landscape     # 16:9 for the briefing and the film
    # vertical (9:16) is intentionally NOT declared: the 9:16 reframe needs
    # Remotion (bootstrap.mjs --with-remotion), which is not installed here, and
    # an ~10-minute film is format-mismatched for vertical (norms are <90s).
    # Restore `- aspect: vertical` once Remotion is present AND a short cut exists.
  formats: [png, pdf, html] # png feeds the video, pdf presents, html converts to PPTX externally
  voice:
    provider: auto
    gender: female
  baseUrl: http://127.0.0.1:8080
  fixedTime: '2026-01-15T09:00:00.000Z'

entries:
  # ======================================================================
  # Beat 0 — the answer, stated up front. DECK ONLY.
  # An executive in a briefing cannot leave, so answer-first costs nothing.
  # A video viewer can leave at any second, so the film opens on the Situation
  # and this slide never appears there.
  # ======================================================================
  - id: 00-answer
    type: slide
    in: [deck]
    layout: hero
    pill: Recommendation
    title: The bed crunch is an orchestration failure, not a construction problem
    body: Synthesise clinical decisions in real time, solve bed constraints by mathematics instead of by phone, and pull discharge into the morning — the capacity is already there.
    cards:
      - icon: activity
        title: Orchestrate, do not build
        text: Recover hidden capacity across the whole admission journey, with no new real estate.

  # ======================================================================
  # RESOLUTION OVERVIEW — the six-part answer-first map (plan §7.2 slide 3).
  # DECK ONLY, carries no `role`: it is not an SCR beat (the archetype caps
  # resolution beats at five), it is the governing map that names all six
  # documented pain points before the five consolidated mechanism beats each
  # demonstrate a subset of them. Companion to 00-answer, same treatment.
  # ======================================================================
  - id: 00b-resolution-map
    type: slide
    in: [deck]
    layout: tiled
    title: One orchestration layer, six pain points resolved
    body: Every beat that follows demonstrates one or more of these — named here once, so nothing is sold twice.
    cards:
      - icon: brain
        title: 1-2. Synthesis and digital dispatch
        text: Findings are pre-read, discordance resolves safely, and the packet reaches bed management with no call.
      - icon: house
        title: '3. Deterministic diversion'
        text: Stable and subacute patients divert to home care or a sister hospital, preserving acute beds.
      - icon: package
        title: '4. Ghost capacity recovered'
        text: A pack-then-batch solver and cohort-swaps free beds that were empty only on paper.
      - icon: smartphone
        title: '5-6. Transparency and early exit'
        text: Families track the journey on a phone, and discharge starts two days ahead of departure.

  # ======================================================================
  # SITUATION beat 1 of 2 — how an admission works today. Warm, human register.
  # Narration binds the vague "many hands" of the previous draft to the concrete
  # thing the viewer is owed: nobody can tell them why (Rule #21).
  # ======================================================================
  - id: 01-situation
    type: slide
    role: situation
    layout: stat-deepdive
    title: The wait every family knows
    stat:
      value: '8-14'
      unit: hours
      label: from arrival in the emergency department to an inpatient bed
    cards:
      - icon: hourglass
        title: A long, silent queue
        text: Patients and families wait without a bed, and without an answer.
        detail: The human cost
      - icon: users-round
        title: Many roles, one patient
        text: An admission crosses the emergency department, specialists, bed management and the ward.
        detail: A shared journey
    narration: "If you have waited with a parent for a hospital bed, you know the quiet despair of it. Eight to fourteen hours from arrival to a ward — and for most of it, nobody can tell you why."

  # ======================================================================
  # SITUATION beat 2 of 2 — the situation-evidence slot the archetype defines
  # (archetypes.md:105) and the previous draft left unused. It exists to make
  # the handoff chain countable: scene 01 asserts "many roles" but never shows
  # them, so the film's central claim (five desks, four handoffs) had no
  # anchor. Runs short deliberately — a second situation beat delays the first
  # mechanism, and audience D drops off in that window.
  # ======================================================================
  - id: 01b-handoffs
    type: slide
    role: situation
    layout: lifecycle
    title: Five desks, four handoffs, every one a phone call
    cards:
      - icon: brain
        title: Doctor to specialist
        text: A page, then a wait for the callback.
      - icon: users-round
        title: Specialist to bed management
        text: The decision, phoned or re-keyed across.
      - icon: gauge
        title: Bed management to ward
        text: A bed offered, then confirmed by phone.
      - icon: refresh-cw
        title: Ward to housekeeping
        text: A vacated bed, reported by phone.
    narration: "Because no one person owns that wait. An emergency doctor decides, a specialist confirms, bed management searches, the ward receives, housekeeping releases. Five desks — and four handoffs between them, every one of which is, today, a phone call."

  # ======================================================================
  # COMPLICATION beat 1 of 2 — the tension. "Cohort locks" is deliberately gone
  # from the voice (Rule #22): it was the single most opaque term in the script
  # and it was spoken 13 seconds in, carrying the whole complication. The card
  # keeps the technical label; the voice carries the meaning.
  # ======================================================================
  - id: 02-complication
    type: slide
    role: complication
    layout: comparison
    title: The beds exist; the coordination does not
    cards:
      - icon: phone-off
        title: Manual phone tag
        text: Departments lose hours to callbacks while the queue grows behind them.
        detail: Hours lost to callbacks
      - icon: lock
        title: Frozen capacity
        text: One patient locks a whole cubicle, and discharge delays trap beds into the afternoon.
        detail: Empty beds nobody can use
    narration: "You cannot build your way out of this, because the beds already exist. They are lost to callbacks that run for hours, to cubicles that can only accept one kind of patient, and to discharges that clear in the afternoon when the queue formed at breakfast."

  # ======================================================================
  # COMPLICATION beat 2 of 2 — the complication-consequence slot
  # (archetypes.md:107), previously unused. deck.mjs:215 warns when a
  # complication names no cost, and the prior draft priced the status quo only
  # qualitatively. The stat here is derived, not invented — see Rule #32.
  # This is a cost of TODAY, so it does not breach Decision #17's reservation
  # of proof for the control tower.
  # ======================================================================
  - id: 02b-frozen
    type: slide
    role: complication
    layout: stat-deepdive
    title: One patient can freeze five beds
    stat:
      value: '5'
      unit: beds
      label: in a six-bed cubicle, reserved to whoever occupies the first one
    cards:
      - icon: lock
        title: The first patient sets the rules
        text: Gender, ward class and infection status are absolute — the cubicle inherits all three.
        detail: A safety rule, not a bug
      - icon: bed
        title: Empty on the board, unusable in practice
        text: If nobody matching is waiting, those beds cannot be offered to anyone at all.
        detail: The capacity to recover
    narration: "Here is that cost at its sharpest. Put one man in an empty six-bed cubicle, and the other five beds can now only take men — same ward class, same infection status. Five beds, empty on the board, unavailable in practice. That is the capacity we set out to recover."

  # ======================================================================
  # RESOLUTION — five beats, each a mechanism slide followed by live captures.
  # ======================================================================

  # ---- Beat 1: diagnostic synthesis, broadcast, safe digital dispatch (PP1+PP2)
  # Narration binds "findings" to BOTH halves (Rule #21): the inputs are vitals
  # and lab results, the output is tier + specialty + monitoring level. It must
  # NOT say "recommends a bed" — that is the solver's job in beat 3, and saying
  # it here would be both factually wrong and a spoiler.
  - id: 03-synthesis
    type: slide
    role: resolution
    layout: process-flow
    title: The decision, synthesised — then dispatched without a call
    cards:
      - icon: brain
        title: Findings, pre-read
        text: Vitals and labs drive a proposed tier, service and telemetry the attending confirms in one click.
      - icon: shield-check
        title: The safer tier wins
        text: When two clinicians disagree, the higher acuity is adopted and telemetry is unioned.
      - icon: send
        title: A structured packet
        text: Consensus lands in bed management as data, ranked by acuity, with no phone call.
    narration: "The first fix is the decision itself. Today a doctor writes notes, pages a specialist, then waits for a callback. Instead, vitals and lab results are read on arrival and become a proposed acuity tier, admitting specialty and level of monitoring — reviewed, not retyped. And where two doctors disagree, we take the higher tier and combine both monitoring orders, because averaging two clinical opinions is the one thing a system must never do. From there the admission reaches bed management as data, not as a phone call."

  # Beat 1 evidence, split into granular capture scenes so each moment of the
  # mechanism gets its own clip. Captures carry no `role`, so none of these
  # count toward the SCR beat cap.
  #
  # 04a restores the clinical specifics that are printed on this very panel
  # (Rule #31) and glosses both "troponin" and "telemetry" on first use, so
  # audience D is not excluded (Rule #24).
  - id: 04a-ed-synthesis-capture
    type: capture
    narration: "Here it is for real. Chua Wee Kiat: chest pain, blood pressure ninety-eight over sixty-two and falling, troponin one-eighty — the protein that leaks into the blood when heart muscle is dying. The dossier has read all three and filled itself in: Tier 2, Cardiology, continuous telemetry — heart rhythm watched without a break. The attending's job here is to agree, or not — to review rather than retype."
    url: /ed
    setupScript: scenes/role-ed.mjs
    roiSelector: '.lg\\:col-span-5'
    overlay: none
    steps:
      - action: click
        selector: 'tr:has-text("Chua Wee Kiat") >> role=button[name="Assess"]'
        target: Assess button on the Chua Wee Kiat row
        delayMs: 700
      - action: waitForText
        value: Smart Assessment Dossier
      - action: wait
        delayMs: 24325
    assert:
      visible: ['Emergency Department (ED) Clinical Intake', 'Waiting ED Patients', 'Chua Wee Kiat']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # Threaded off 04a: the tier dropdown shows the full 5-tier framework, then a
  # cut to Nurul Huda's stable pathway supplies the contrast (verified live:
  # ed.tsx:708 five-tier <select>; Q-P121 seeded at DataInitializer.java:946
  # with a normal troponin and stable BP 124/78).
  #
  # The payoff clause is the point of this scene and was previously missing: it
  # demonstrates the synthesis is not biased toward admitting.
  - id: 04a2-tier-framework-capture
    type: capture
    narration: "The same field spans five tiers, from critical resuscitation down to extended observation. And it does not lean toward admitting: Nurul Huda's pneumonia, normal troponin and stable blood pressure come up as Tier 3, General Medicine, with no monitoring at all."
    url: /ed
    setupScript: scenes/role-ed.mjs
    roiSelector: '.lg\\:col-span-5'
    overlay: none
    steps:
      - action: click
        selector: 'tr:has-text("Chua Wee Kiat") >> role=button[name="Assess"]'
        target: Assess button on the Chua Wee Kiat row
        delayMs: 700
      - action: waitForText
        value: Smart Assessment Dossier
      - action: click
        selector: 'select:has(option[value="TIER_1_CRITICAL"])'
        target: Urgency Acuity Tier dropdown
        delayMs: 900
      - action: wait
        delayMs: 1500
      - action: press
        value: Escape
        delayMs: 400
      - action: click
        selector: 'tr:has-text("Nurul Huda") >> role=button[name="Assess"]'
        target: Assess button on the Nurul Huda row
        delayMs: 700
      - action: waitForText
        value: Smart Assessment Dossier
      - action: wait
        delayMs: 13725
    assert:
      visible: ['Emergency Department (ED) Clinical Intake', 'Waiting ED Patients', 'Nurul Huda']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # "Discordance" is gone from the voice (Rule #22) — the concept survives
  # paraphrase intact, and nothing on screen uses the word. The specifics come
  # straight off the consult note visible in this shot.
  - id: 04b-specialist-discordance-capture
    type: capture
    narration: "Now the disagreement. Mr Fernandez came up as acute but stable; the cardiologist reads a rising troponin and changing ECG segments, and pushes him to Tier 2 with monitoring made mandatory. Both opinions stay visible — and the higher one is what the rest of the system acts on."
    url: /specialist
    setupScript: scenes/role-specialist.mjs
    roiSelector: '.grid.grid-cols-1.md\\:grid-cols-2'
    overlay: none
    steps:
      - action: wait
        delayMs: 19600
    assert:
      visible: ['Inpatient Specialist Consult Broadcast Pool', 'Mr Fernandez', 'ED Attending Priority', 'Consult Impression']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # Threaded off 04b. The previous narration said a Surgery consult was chained
  # without saying WHAT FOR — while the reason was printed on screen the whole
  # time (DataInitializer.java:800, "concurrent abdominal pain"). Unstated
  # criterion, now stated.
  - id: 04b2-chain-consult-capture
    type: capture
    narration: "He does not only need Cardiology. The same note flags abdominal pain, so a surgical review is chained on from here and runs alongside it — two specialties at once, rather than one after the other."
    url: /specialist
    setupScript: scenes/role-specialist.mjs
    roiSelector: '.grid.grid-cols-1.md\\:grid-cols-2'
    overlay: none
    steps:
      - action: click
        selector: 'div.group\/card:has-text("Mr Fernandez") >> role=button[name="Chain Consult"]'
        target: Chain Consult button on the Mr Fernandez broadcast card
        delayMs: 700
      - action: waitForText
        value: Chain Secondary Specialist Consult
      - action: wait
        delayMs: 13175
    assert:
      visible: ['Inpatient Specialist Consult Broadcast Pool', 'Mr Fernandez']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # 04c binds the previously unbound "packet" to its actual contents, and
  # introduces the protagonist (Rule #29). Mr Tan Ah Meng already appears in
  # 04c / 04c2 / 08a / 10a — a nearly complete journey that the prior script
  # never told the viewer to follow.
  - id: 04c-bmu-dispatch-capture
    type: capture
    narration: "Once the consults are back, the request appears here in bed management on its own: tier, specialty, ward class and monitoring needs, all attached. Nobody rang anyone. This is Mr Tan Ah Meng — follow him from here."
    url: /bmu
    setupScript: scenes/role-bmu.mjs
    roiSelector: '.lg\\:col-span-7'
    overlay: none
    steps:
      - action: wait
        delayMs: 14850
    assert:
      visible: ['Bed Management Unit (BMU) Capacity & Allocation Hub', 'Prioritized Admission Requests', 'Tan Ah Meng']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # Threaded off 04c, hidden-depth direct-sell: the coordinator is not locked
  # out of the clinical picture after the safety-first escalation fires
  # (verified live: bmu.tsx:381 button, dialog "Clinical Consensus &
  # Comparative Notes" at bmu.tsx:1624). The payoff — autonomy preserved
  # WITHOUT blocking the bed search — is the point, and is now said out loud.
  - id: 04c2-reconcile-notes-capture
    type: capture
    narration: "Escalating automatically could have buried the disagreement, so it does not. Opening Mr Tan Ah Meng's comparative notes lays the emergency and specialist assessments side by side, and the coordinator can still ask the two to reconcile — while the safer bed search carries on regardless."
    url: /bmu
    setupScript: scenes/role-bmu.mjs
    roiSelector: '.lg\\:col-span-7'
    overlay: none
    steps:
      - action: click
        selector: 'tr:has-text("Tan Ah Meng") >> [title="View Comparative Notes"]'
        target: View Comparative Notes button on the Tan Ah Meng row
        delayMs: 700
      - action: waitForText
        value: Clinical Consensus & Comparative Notes
      - action: wait
        delayMs: 18475
    assert:
      visible: ['Bed Management Unit (BMU) Capacity & Allocation Hub', 'Tan Ah Meng']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # ---- Beat 2: deterministic diversion — MIC@Home and sister hospitals (PP3)
  # "Subacute" and "step-down" are gone from the voice (Rule #22). The contrast
  # bridge restores the old deck's 04-before-diversion point: diversion was
  # always possible, it was the paperwork that killed it.
  - id: 05-diversion
    type: slide
    role: resolution
    layout: tiled
    title: Not every admission needs a scarce acute bed
    cards:
      - icon: house
        title: Hospital at home
        text: Clinically stable patients are diverted to a monitored virtual ward.
      - icon: hospital
        title: Sister community hospital
        text: Subacute recovery is referred with a thirty-minute timer, not a phone negotiation.
      - icon: bed
        title: An acute bed preserved
        text: Each diversion returns a physical bed to the patients who need one.
    narration: "The second fix is admitting fewer people at all. Diversion was always possible — it was just buried under enough paperwork that clinicians took the acute bed instead. So the alternatives became the easy path: a patient stable enough gets hospital-level monitoring at home with a daily visit, and a patient who mainly needs weeks of rehabilitation goes to a community hospital as a digital referral, with a thirty-minute clock on the reply."

  # Beat 2 evidence. 06a carries the name-collision fix (Rule #30): Mrs Tan Boon
  # Hwa is spoken in full and explicitly marked as a different patient, because
  # P106 is the only hospital-at-home diversion in the seed and cannot be
  # swapped out. The payoff — a diversion must read as a decision, not a
  # refusal — is the point of showing it on the patient's own screen.
  - id: 06a-mic-at-home-capture
    type: capture
    narration: "On the patient's own screen now — and a different patient, Mrs Tan Boon Hwa. She is not queuing for a bed at all: she is on hospital-at-home care, visited daily by a monitoring team. Her tracker says exactly that, so a diversion reads as a decision made for her, not a bed she was refused."
    url: /patient
    setupScript: scenes/role-patient.mjs
    roiSelector: main
    overlay: none
    steps:
      - action: selectOption
        selector: 'select:has(option[value="Q-P106"])'
        target: Simulate Patient token selector
        value: Q-P106
        delayMs: 1500
      - action: waitForText
        value: Alternative Step-Down Care Recommended
      - action: wait
        delayMs: 18175
    assert:
      visible: ['Public Milestone Tracker']
      notVisible: ['Something went wrong', 'Failed to track']

  # "Bilateral" is gone from the voice (Rule #22) — replaced by what it
  # actually means: a reply window both hospitals can see.
  - id: 06b-sister-hospital-capture
    type: capture
    narration: "Back in bed management, the other kind of diversion. Mr Ahmad Ibrahim needs stroke rehabilitation rather than an acute ward, so a referral now sits with Outram Community Hospital under a thirty-minute reply window that both hospitals can see."
    url: /bmu
    setupScript: scenes/role-bmu.mjs
    roiSelector: '.lg\\:col-span-7'
    overlay: none
    steps:
      - action: click
        selector: 'tr:has-text("Ahmad Ibrahim") >> role=button[name="Select"]'
        target: Select button on the Ahmad Ibrahim row
        delayMs: 700
      - action: waitForText
        value: REF-OCH-8812
      - action: wait
        delayMs: 16350
    assert:
      visible: ['Bed Management Unit (BMU) Capacity & Allocation Hub', 'Ahmad Ibrahim']
      notVisible: ['Something went wrong', 'No static resource', 'Sign in']

  # ---- Beat 3: ghost capacity — pack-then-batch solver + cohort-swap (PP4)
  # "Ghost capacity" is gone from the voice; the narration instead reaches back
  # to the five frozen beds priced in 02b, which is what makes this beat land
  # as a resolution of a stated cost rather than a clever trick.
  - id: 07-ghost
    type: slide
    role: resolution
    layout: process-flow
    title: The insight that recovers ghost capacity is the ordering
    cards:
      - icon: package
        title: Pack first
        text: Waiting patients fill partly-used cubicles that already match their cohort.
      - icon: layers
        title: Then batch
        text: Only then is a whole clean cubicle designated for a surge cluster.
      - icon: arrow-left-right
        title: Swap to unlock
        text: One patient blocking a ward is moved to an equal bed, freeing the whole room.
    narration: "The third fix recovers those five frozen beds, and it comes down to ordering. Fill the part-used cubicles first, with patients who already match the people in them. Only then open a clean cubicle — and open it for a whole group at once. And when a single patient is the only reason a room is unusable, move that patient, not the room. Same beds, same safety rules, a different order of operations."

  # Beat 3 evidence. 07a is placed first and is self-contained: the four-state
