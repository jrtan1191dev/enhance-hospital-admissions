# Hospital Admissions — SCR pitch deck and video spine.
#
# deck.yaml is the authored source. `node scripts/compile.mjs` turns it into
# storyboard.json (generated, committed, never hand-edited). `node scripts/deck.mjs`
# renders the slides to PNG/PDF/HTML with no TTS, no running app and no cost.
#
# Structure follows narration-video-plan.md §7 (nested SCR), reconciled to the
# SCR archetype's hard cap of five resolution beats:
#   - one macro Situation + macro Complication, established once
#   - five resolution beats, each a mechanism-only setup slide immediately
#     followed by a run of live captures that demonstrate it (the archetype
#     convention: the slide makes the claim, the captures are the evidence)
#   - the six documented pain points are grouped into four mechanism beats plus
#     a measurable-outcome beat:
#       1. synthesis + safe digital dispatch      (PP1 + PP2)
#       2. deterministic diversion                (PP3)
#       3. ghost capacity, pack-then-batch        (PP4)
#       4. transparency + discharge runway        (PP5 + PP6)
#       5. the control tower — every decision measured
#   - all quantified proof is withheld until the control-tower beat (Decision
#     #17: setup slides carry mechanism only).
#
# Each beat's single capture is split into several granular capture-only
# scenes — one per distinct mechanism or persona named in the mechanism
# slide's cards (e.g. beat 1 has separate scenes for ED synthesis, specialist
# discordance, and BMU dispatch) — so the film shows each moment as its own
# clip rather than one long take. Captures carry no `role`, so this granular
# split does NOT count toward the archetype's 5-beat cap; only `slide` entries
# with `role: resolution` do.
#
# Voice register: warm/human on the Situation and CTA bookends; crisp and
# analytical on the resolution beats (Decision #16). SCR is unlabelled — the
# structure is carried by layout and cadence, not by "Issue:/Resolution:" tags.
#
# Capture entries carry NO `role`: they are evidence, not SCR beats, so they
# must not count toward the beat totals.

deck:
  title: Recovering Hospital Beds Without Building More
  archetype: scr            # situation -> complication -> resolution beat checks
  engine: html              # bento templates — the polished, non-wordy look
  theme: light              # matches the light app UI, so cuts to the dashboards do not flash
  aspect: landscape
  outputs:
    - aspect: landscape     # 16:9 for the briefing and the film
    - aspect: vertical      # 9:16 reflows via `native` — the deck owns its CSS
  formats: [png, pdf, html] # png feeds the video, pdf presents, html converts to PPTX externally
  voice:
    provider: auto
    gender: female
  baseUrl: http://127.0.0.1:8080
  fixedTime: '2026-01-15T09:00:00.000Z'

entries:
  # ======================================================================
  # Beat 0 — the answer, stated up front. DECK ONLY.
  # An executive in a briefing cannot leave, so answer-first costs nothing.
  # A video viewer can leave at any second, so the film opens on the Situation
  # and this slide never appears there.
  # ======================================================================
  - id: 00-answer
    type: slide
    in: [deck]
    layout: hero
    pill: Recommendation
    title: The bed crunch is an orchestration failure, not a construction problem
    body: Synthesise clinical decisions in real time, solve bed constraints by mathematics instead of by phone, and pull discharge into the morning — the capacity is already there.
    cards:
      - icon: activity
        title: Orchestrate, do not build
        text: Recover hidden capacity across the whole admission journey, with no new real estate.

  # ======================================================================
  # RESOLUTION OVERVIEW — the six-part answer-first map (plan §7.2 slide 3).
  # DECK ONLY, carries no `role`: it is not an SCR beat (the archetype caps
  # resolution beats at five), it is the governing map that names all six
  # documented pain points before the five consolidated mechanism beats each
  # demonstrate a subset of them. Companion to 00-answer, same treatment.
  # ======================================================================
  - id: 00b-resolution-map
    type: slide
    in: [deck]
    layout: tiled
    title: One orchestration layer, six pain points resolved
    body: Every beat that follows demonstrates one or more of these — named here once, so nothing is sold twice.
    cards:
      - icon: brain
        title: 1-2. Synthesis and digital dispatch
        text: Findings are pre-read, discordance resolves safely, and the packet reaches bed management with no call.
      - icon: house
        title: '3. Deterministic diversion'
        text: Stable and subacute patients divert to home care or a sister hospital, preserving acute beds.
      - icon: package
        title: '4. Ghost capacity recovered'
        text: A pack-then-batch solver and cohort-swaps free beds that were empty only on paper.
      - icon: smartphone
        title: '5-6. Transparency and early exit'
        text: Families track the journey on a phone, and discharge starts two days ahead of departure.

  # ======================================================================
  # SITUATION — how an admission works today. Warm, human register.
  # ======================================================================
  - id: 01-situation
    type: slide
    role: situation
    layout: stat-deepdive
    title: The wait every family knows
    stat:
      value: '8-14'
      unit: hours
      label: from arrival in the emergency department to an inpatient bed
    cards:
      - icon: hourglass
        title: A long, silent queue
        text: Patients and families wait without a bed, and without an answer.
        detail: The human cost
      - icon: users-round
        title: Many roles, one patient
        text: An admission crosses the emergency department, specialists, bed management and the ward.
        detail: A shared journey
    narration: If you have ever waited with a parent for a hospital bed, you know the quiet despair of a long, silent queue that crosses many hands before it ends.

  # ======================================================================
  # COMPLICATION — the tension, priced. The archetype requires a named cost.
  # ======================================================================
  - id: 02-complication
    type: slide
    role: complication
    layout: comparison
    title: The beds exist; the coordination does not
    cards:
      - icon: phone-off
        title: Manual phone tag
        text: Departments lose hours to callbacks while the queue grows behind them.
        detail: Hours lost to callbacks
      - icon: lock
        title: Frozen capacity
        text: One patient locks a whole cubicle, and discharge delays trap beds into the afternoon.
        detail: Empty beds nobody can use
    narration: You cannot build your way out of a flow bottleneck. Phone calls between departments, cubicles frozen by cohort locks, and afternoon discharge delays cost a hospital the capacity it already has.

  # ======================================================================
  # RESOLUTION — five beats, each a mechanism slide followed by a live capture.
  # ======================================================================

  # ---- Beat 1: diagnostic synthesis, broadcast, safe digital dispatch (PP1+PP2)
  - id: 03-synthesis
    type: slide
    role: resolution
    layout: process-flow
    title: The decision, synthesised — then dispatched without a call
    cards:
      - icon: brain
        title: Findings, pre-read
        text: Vitals and labs drive a proposed tier, service and telemetry the attending confirms in one click.
      - icon: shield-check
        title: The safer tier wins
        text: When two clinicians disagree, the higher acuity is adopted and telemetry is unioned.
      - icon: send
        title: A structured packet
        text: Consensus lands in bed management as data, ranked by acuity, with no phone call.
    narration: The first fix is the decision itself. Findings are synthesised on arrival, disagreement resolves toward the safer tier, and the moment consensus is reached the admission lands in the queue as data — no call placed.

