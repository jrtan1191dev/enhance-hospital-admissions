  - id: 08c-cohort-swap-capture
    type: capture
    narration: "And this is the unlock. One patient, still down in the emergency department, is the only reason an entire ward cannot be released to the group waiting for it. The system offers him an equal bed — same class, same monitoring — and one approval frees the room. He loses nothing; the ward becomes usable."
