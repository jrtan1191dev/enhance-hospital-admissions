  # Absolute url: the reports are served from :4173, so the application is left
  # untouched rather than serving coverage HTML from its static resources.
  #
  # Numbers MEASURED 18 Sep (D8: measure first, then write the line). JaCoCo over
  # the whole 50-class bundle: 94% instructions, 78 of 2,832 lines missed (97%),
  # 315 of 1,021 branches missed (69%). The branch figure is the weak one and is
  # therefore the one spoken.
  - id: 09d-coverage-capture
    type: capture
    narration: "Measured, on the whole backend bundle: ninety-four percent of instructions, ninety-seven percent of lines — and sixty-nine percent of branches. That last number is the one worth saying out loud, because it is where the untested paths actually live. It is evidence the domain layer is exercised. It is not a quality gate."
    url: http://127.0.0.1:4173/jacoco/index.html
    roiSelector: 'body'
    overlay: none
    # stills, not screencast: this is a third-party static report we cannot animate,
    # and a static page starves Chrome's change-driven screencast (measured: 200ms
    # for a 21s scene). captureStills renders exactly sceneMs from one screenshot.
    captureMode: stills
    assert:
      visible: ['Missed Instructions', 'com.hospital.admissions', 'Total']
      notVisible: ['Cannot GET', 'Not Found']

  # The single most on-thesis take in the film, and the one most likely to be cut:
  # the frontend declares four 90% thresholds (vitest.config.ts) and MEASURED on
  # 18 Sep it fails one of them — branches 74.84%. It fails because nothing runs
  # it: no CI, and the committed frontend/coverage/ HTML is from 10 Sep and still
  # claims 100%. A gate nobody runs is not a gate, and this is that sentence with
  # evidence under it.
  - id: 09e-gate-red-terminal
    type: capture
    narration: "And here is what that costs, right now. The frontend declares four coverage thresholds at ninety percent. Run them and one is red — branches at seventy-five. Nothing caught that, because nothing runs it. A gate no pipeline executes is not a gate; it is a comment with a number in it."
    url: http://127.0.0.1:4173/term.html?run=09e-gate-red
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 18450
    assert:
      visible: ['branches: 90', 'does not meet global threshold', '74.84%']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  # ==========================================================================
  # Close and CTA — unroled (the remaining two of the four permitted jobs).
  # ==========================================================================

  # Debts grouped into four cards because `tiled` takes at most four, and because
  # grouping reads better than a seven-row list. Each card pairs the debt with the
  # seam already cut for it — that pairing is what keeps the register "roadmap
  # under control" rather than "confession".
  - id: 10-ledger
    type: slide
    layout: tiled
    title: What is owed, and the seam it is owed against
    body: Every line here is a decision I would make the same way again, and none of them are finished.
    cards:
      - icon: database
        title: State and transport
        text: In-memory data a restart erases, and polling that will not scale.
        detail: Driver present; ticket 003 holds the push design
      - icon: user-check
        title: Identity
        text: Header-driven personas are convenience, not authentication.
        detail: The default config already denies everything
      - icon: cpu
        title: Optimality and integration
        text: A heuristic that can be beaten, and two gateways with nothing real behind them.
        detail: 3 interfaces, 3 fail-fast adapters
      - icon: test-tube
        title: Enforcement
        text: Four declared thresholds, no pipeline to run them, and one currently red.
        detail: The suite is the foundation; the gate is the adapter
    narration: "So here is what is owed. In-memory data that a restart erases. Polling that will not scale. A heuristic that is not optimal. Personas that are not authentication. A prototype profile that is the configuration default. And a coverage threshold that is failing right now because nothing runs it. Each one has its seam already cut, and that is the only reason I can list them this calmly. On method: AI wrote a great deal of this code. Which trade-off to take, which approach was better, and what the final code looks like — those were mine."

  # Countable artifacts, because "the specs came first" is exactly the claim a
  # skeptic doubts, and it is countable rather than assertable. Chooses
  # transparency about the agent tooling over polish.
  - id: 10a-artifacts-terminal
    type: capture
    narration: "One last count, because sequence is the part people doubt. Eleven decision tickets, twenty-eight implementation issues, five specifications, four decision records — written before the code they describe."
    url: http://127.0.0.1:4173/term.html?run=10a-artifacts
    roiSelector: '#term'
    overlay: none
    steps:
      - action: wait
        delayMs: 13453
    assert:
      visible: ['wayfinder tickets : 11', 'scratch issues    : 28', 'decision records  : 4']
      notVisible: ['Cannot GET', 'Not Found', 'command not found']

  - id: 11-cta
    type: slide
    layout: hero
    pill: Where to argue with me
    title: If you would have traded differently, that is the conversation I want
    body: The readme is the map. The decision records and tickets are the reasoning. The prototype is live.
    cards:
      - icon: route
        title: Five decisions, five prices
        text: Every one of them is written down, including the ones I got wrong.
        detail: Cold start takes about fifty seconds
    narration: "Five decisions, five prices, and you have heard what each one cost. If you would have traded differently on any of them, that is the conversation I want. The readme is the map, the decision records and the tickets are the reasoning, and the prototype is live — give it about fifty seconds to wake up."
