<svg viewBox="0 0 1176 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-separation-title 07-separation-desc">
<title id="07-separation-title">Clinical and bed decisions have different owners</title>
<desc id="07-separation-desc">Swimlane in which clinicians assess acuity, set telemetry and decide diversion, then hand off after consensus to bed management, which sets the admitting cluster and allocates the bed.</desc>
<defs>
<marker id="07-separation-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#64748B"/></marker>
<marker id="07-separation-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#10B981"/></marker>
</defs>
<rect width="1176" height="736" fill="#F1F5F9"/>
<rect x="16" y="16" width="1152" height="344" rx="6" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="60" fill="#64748B" font-size="19" font-weight="500" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.12em">CLINICIANS</text>
<rect x="16" y="384" width="1152" height="344" rx="6" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="428" fill="#64748B" font-size="19" font-weight="500" font-family="ui-monospace, Menlo, Consolas, monospace" letter-spacing="0.12em">BED MANAGEMENT</text>
<path d="M272 200 H316" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#07-separation-arrow)"/>
<path d="M568 200 H612" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#07-separation-arrow)"/>
<path d="M740 248 V508" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#07-separation-arrow-accent)"/>
<rect x="752" y="292" width="184" height="28" rx="2" fill="#F1F5F9"/>
<text x="760" y="312" fill="#0F172A" font-size="19" font-weight="500" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">POST-CONSENSUS</text>
<path d="M864 576 H908" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#07-separation-arrow)"/>
<rect x="24" y="152" width="248" height="96" rx="6" fill="#F1F5F9"/>
<rect x="24" y="152" width="248" height="96" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<text x="148" y="209" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">Assess acuity</text>
<rect x="320" y="152" width="248" height="96" rx="6" fill="#F1F5F9"/>
<rect x="320" y="152" width="248" height="96" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<text x="444" y="209" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">Set telemetry</text>
<rect x="616" y="152" width="248" height="96" rx="6" fill="#F1F5F9"/>
<rect x="616" y="152" width="248" height="96" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<text x="740" y="209" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">Decide diversion</text>
<rect x="616" y="512" width="248" height="128" rx="6" fill="#F1F5F9"/>
<rect x="616" y="512" width="248" height="128" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<text x="740" y="570" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">Set admitting</text>
<text x="740" y="600" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">cluster</text>
<rect x="912" y="512" width="248" height="128" rx="6" fill="#F1F5F9"/>
<rect x="912" y="512" width="248" height="128" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
<text x="1036" y="585" fill="#0F172A" font-size="24" font-weight="600" font-family="Inter, system-ui, sans-serif" text-anchor="middle">Allocate bed</text>
</svg>
